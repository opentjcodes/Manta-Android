name: Build & Release Manta Universal Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      manta_core_repo:
        description: 'GitHub owner/repo for Manta Rust Core'
        required: false
        default: 'opentjcodes/Manta'

permissions:
  contents: write

jobs:
  build-manta-android:
    runs-on: ubuntu-latest

    env:
      MANTA_CORE_REPO: ${{ github.event.inputs.manta_core_repo || 'opentjcodes/Manta' }}

    steps:
      - name: Checkout Manta Android Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fetch Prebuilt Manta Rust Core (or Compile Fallback)
        run: |
          chmod +x scripts/fetch-manta-core.sh
          ./scripts/fetch-manta-core.sh "$MANTA_CORE_REPO"

      - name: Sync Official logo.png from Manta Core Repository
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          if ! file logo.png 2>/dev/null | grep -q "PNG image data"; then
            curl -fsSL "https://raw.githubusercontent.com/${MANTA_CORE_REPO}/main/logo.png" -o logo.png || true
          fi
          if ! file logo.png 2>/dev/null | grep -q "PNG image data"; then
            python3 -c '
          import struct, zlib
          w, h = 128, 128
          raw = b"".join(b"\x00" + b"\x09\x0a\x0f\xff" * w for _ in range(h))
          def chunk(t, d):
              return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          open("logo.png", "wb").write(png)
          '
          fi
          file logo.png
          cp logo.png app/src/main/res/drawable-nodpi/logo.png

      - name: Install Gradle 8.10.2 & Build Universal Release + Debug APKs
        run: |
          if ! gradle --version 2>/dev/null | grep -q "8.10.2"; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle-8.10.2.zip
            sudo unzip -q -o /tmp/gradle-8.10.2.zip -d /opt
            export PATH="/opt/gradle-8.10.2/bin:$PATH"
          fi
          gradle assembleRelease assembleDebug --no-daemon

      - name: Upload Manta Universal Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manta-Android-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Manta Universal Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Manta-Android-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish GitHub Release with Universal APKs
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.0.{0}', github.run_number) }}
          name: "Manta Android Browser ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.0.{0}', github.run_number) }}"
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
